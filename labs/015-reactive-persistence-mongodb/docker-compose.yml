version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb-lab15
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate() }" | mongosh --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
