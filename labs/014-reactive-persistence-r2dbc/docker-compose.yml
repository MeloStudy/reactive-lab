services:
  postgres-lab:
    image: postgres:16-alpine
    container_name: postgres-lab-14
    environment:
      POSTGRES_DB: reactivelab
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reactivelab"]
      interval: 5s
      timeout: 5s
      retries: 5

  lab-014-app:
    build: .
    container_name: lab-014-app
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-lab:5432/reactivelab
      SPRING_R2DBC_USERNAME: user
      SPRING_R2DBC_PASSWORD: pass
      SPRING_SQL_INIT_MODE: always
    depends_on:
      postgres-lab:
        condition: service_healthy
